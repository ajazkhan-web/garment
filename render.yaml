services:
  - type: worker
    name: apparel-pattern-bot
    env: python
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_MODE
        value: polling
